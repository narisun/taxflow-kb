[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxkb"
version = "0.2.0"
description = "TaxKB — AI-Powered IRS Knowledge Base for CPAs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["taxkb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 60
# By default we skip the Postgres-backed integration suite — run it with:
#   pytest -m integration
# or the full suite with:
#   pytest -m "unit or integration"
addopts = "-m 'not integration'"
markers = [
    "unit: fast in-memory tests (default)",
    "integration: tests that require a live Postgres (set TEST_DATABASE_URL)",
    "slow: long-running tests — skip in CI by default",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    "ignore::DeprecationWarning:anthropic.*",
]

[tool.coverage.run]
source = ["api"]
branch = true
omit = [
    "api/tax_engine/pdf/*",
    "*/tests/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
