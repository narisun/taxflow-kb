# TaxFlow AI — Knowledge Base Local Development Stack
# Starts Neo4j and PostgreSQL for Layer 1 development and testing.
#
# All credentials and ports are sourced from .env (same directory as this file).
# To run against a different environment, swap .env — no edits to this file.
#
# Usage:
#   cp .env.example .env    # first time only
#   docker compose up -d
#   docker compose down -v  # tear down and remove volumes

services:

  # ── Neo4j Community Edition ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: taxflow-neo4j
    ports:
      - "${NEO4J_BROWSER_PORT:-7474}:7474"   # Browser UI: http://localhost:7474
      - "${NEO4J_BOLT_PORT:-7687}:7687"      # Bolt protocol (used by Python driver)
    environment:
      # In production, set NEO4J_PASSWORD explicitly in .env — the default below
      # only exists so `docker compose up -d` works out of the box for new devs.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-taxflow_dev}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./taxkb/schema:/var/lib/neo4j/import     # Schema cypher files accessible in import
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── PostgreSQL (with pgvector for Layer 3 semantic search) ─────────────────
  # Schema is applied by the Python CLI — not docker-entrypoint-initdb.d — because
  # host-mount permissions vary across OSes. Apply with:
  #   python cli.py ingest --csv <file> ... --init-schema
  postgres:
    image: pgvector/pgvector:pg16
    container_name: taxflow-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # In production, set POSTGRES_PASSWORD explicitly in .env. The default
      # below is only for local dev convenience.
      POSTGRES_DB:       ${POSTGRES_DB:-taxflow}
      POSTGRES_USER:     ${POSTGRES_USER:-taxflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxflow_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  pg_data:
